<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
<title id="t">Where Mastyf sits</title><desc id="d">Agents such as Claude Code, Cursor and VS Code start their MCP servers through the Mastyf proxy, which checks every call with your rules, an optional model and a result check, then forwards allowed calls. Decisions go to history.db, read by the dashboard, Threat Lab and the Security Swarm.</desc>
<style>.fl{stroke-dasharray:5 7;animation:fl 1.6s linear infinite}@keyframes fl{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){.fl{animation:none}}</style>
