name: Build and Release Mastyf Shield Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish to (e.g. v0.2.2)'
        required: false
        default: 'v0.2.2'

permissions:
  contents: write
  packages: write

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    env:
      MASTYF_SKIP_BFF_BUILD: '1'
      MASTYF_SKIP_SPA_BUILD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Package macOS ARM64 & Intel DMGs
        run: |
          cd apps/mastyf-shield-desktop
          npm install
          sh scripts/pack-mac.sh
          mkdir -p dist/normalized
          cp dist/*arm64*.dmg dist/normalized/Mastyf-Shield-latest-arm64.dmg || true
          for f in dist/*.dmg; do
            if [ -f "$f" ] && echo "$f" | grep -v "arm64" >/dev/null; then
              cp "$f" dist/normalized/Mastyf-Shield-latest-x64.dmg || true
            fi
          done
          echo "=== Built macOS Dist ==="
          ls -la dist/
          echo "=== Normalized Artifacts ==="
          ls -la dist/normalized/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shield-mac
          path: apps/mastyf-shield-desktop/dist/normalized/*.dmg
          retention-days: 7

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    env:
      MASTYF_SKIP_BFF_BUILD: '1'
      MASTYF_SKIP_SPA_BUILD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Package Linux & Portable Windows Binaries
        run: |
          cd apps/mastyf-shield-desktop
          npm install
          sh scripts/pack-linux.sh
          # Build Windows zip directly on Linux (does not need wine)
          npx electron-builder --win zip --x64 -c.win.signAndEditExecutable=false || true
          mkdir -p dist/normalized
          cp dist/*.AppImage dist/normalized/Mastyf-Shield-latest.AppImage || true
          cp dist/*.deb dist/normalized/Mastyf-Shield-latest.deb || true
          cp dist/*.zip dist/normalized/Mastyf-Shield-win-x64.zip || true
          echo "=== Built Linux Dist ==="
          ls -la dist/
          echo "=== Normalized Artifacts ==="
          ls -la dist/normalized/
          # Archive staged bundle for Windows runner
          tar -czf staged-pack.tar.gz .pack-resources

      - name: Upload Linux & Portable Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shield-linux
          path: |
            apps/mastyf-shield-desktop/dist/normalized/*.AppImage
            apps/mastyf-shield-desktop/dist/normalized/*.deb
            apps/mastyf-shield-desktop/dist/normalized/*.zip
          retention-days: 7

      - name: Upload Staged Stack Archive for Windows
        uses: actions/upload-artifact@v4
        with:
          name: staged-pack-archive
          path: apps/mastyf-shield-desktop/staged-pack.tar.gz
          retention-days: 1

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    needs: [build-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Staged Stack Archive
        uses: actions/download-artifact@v4
        with:
          name: staged-pack-archive
          path: apps/mastyf-shield-desktop

      - name: Package Windows NSIS Installer
        shell: bash
        run: |
          cd apps/mastyf-shield-desktop
          tar -xzf staged-pack.tar.gz
          npm install
          find .pack-resources -type f -name "*.exe" -delete 2>/dev/null || true
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --win nsis zip --x64 -c.win.signAndEditExecutable=false
          mkdir -p dist/normalized
          cp dist/*.exe dist/normalized/Mastyf-Shield-Setup-latest.exe || true
          cp dist/*.zip dist/normalized/Mastyf-Shield-win-x64.zip || true
          echo "=== Built Windows Dist ==="
          ls -la dist/
          echo "=== Normalized Artifacts ==="
          ls -la dist/normalized/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shield-windows
          path: |
            apps/mastyf-shield-desktop/dist/normalized/*.exe
            apps/mastyf-shield-desktop/dist/normalized/*.zip
          retention-days: 7

  publish-release:
    name: Publish Release Assets to GitHub
    runs-on: ubuntu-latest
    needs: [build-mac, build-linux, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-binaries
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Mastyf Shield Desktop ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
