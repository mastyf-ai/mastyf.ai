name: Agent libraries

# Tests the Python package (mastyf-ai) and the TypeScript package (@mastyf_ai/guard) on every
# change to them or to the check engine they start. Both start the real engine, so the engine's
# single-file bundle is built first. Nothing is published.

on:
  pull_request:
    paths:
      - 'packages/python-sdk/**'
      - 'packages/guard/**'
      - 'packages/check/**'
      - 'packages/langchain-middleware/**'
      - 'packages/openai-agents-middleware/**'
      - 'src/policy/**'
      - 'src/proxy/**'
      - 'src/scanners/**'
      - '.github/workflows/agent-libraries.yml'

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mastyf_ai/check --ignore-scripts
      - run: pnpm --filter @mastyf_ai/check build
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        working-directory: packages/python-sdk
        run: uv run --isolated --with pytest --with pytest-asyncio --with ".[langchain,langgraph,openai-agents]" pytest tests -q

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mastyf_ai/guard... --filter @mastyf_ai/langchain-middleware --filter @mastyf_ai/openai-agents-middleware --ignore-scripts
      - run: pnpm --filter @mastyf_ai/check build
      - run: pnpm --filter @mastyf_ai/guard typecheck
      - run: pnpm --filter @mastyf_ai/guard test
      - run: pnpm --filter @mastyf_ai/langchain-middleware --filter @mastyf_ai/openai-agents-middleware build

  # The Mastra adapter against the real @mastra/core. Mastra needs Node 22.13, so it isn't part of the
  # repository's own install (which must work on Node 20): a scratch project installs it with the
  # packed check and guard packages and runs scripts/mastra-smoke.mjs.
  mastra-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mastyf_ai/guard... --ignore-scripts
      - run: pnpm --filter @mastyf_ai/check build
      - run: pnpm --filter @mastyf_ai/guard build
      - name: Pack check and guard
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          (cd packages/check && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          (cd packages/guard && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
      - name: Real Mastra in a scratch project
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null && npm pkg set type=module
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz "@mastra/core@^1" "zod@^4"
          cp "$GITHUB_WORKSPACE/packages/guard/scripts/mastra-smoke.mjs" .
          node mastra-smoke.mjs
