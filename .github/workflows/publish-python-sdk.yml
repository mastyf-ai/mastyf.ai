name: Publish mastyf-ai (Python)

# Publishes only the Python library to PyPI, when a tag like python-v5.0.1 is pushed. The general
# "Publish" workflow (v* tags) also pushes Docker images and npm packages; a library fix doesn't need those.

on:
  push:
    tags:
      - 'python-v*'

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The tests start the free check program, which is built from packages/check.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mastyf_ai/check --ignore-scripts
      - run: pnpm --filter @mastyf_ai/check build
      - name: Tag matches the package version
        working-directory: packages/python-sdk
        run: |
          want="python-v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version ($want)"; exit 1
          fi
      - name: The check program's hashes are filled in
        working-directory: packages/python-sdk
        run: |
          python - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("s", "mastyf_ai/_check_sha256.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          need = {f"mastyf-check-{p}" for p in ("win-x64.exe", "linux-x64", "linux-arm64", "darwin-x64", "darwin-arm64")}
          missing = need - set(m.SHA256)
          if missing:
              sys.exit(f"missing SHA-256 for: {sorted(missing)}")
          PY
      - run: pip install build twine
      - name: Test
        working-directory: packages/python-sdk
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest
          python -m pytest -q tests/test_program.py
      - run: cd packages/python-sdk && python -m build
      - run: twine upload packages/python-sdk/dist/* -u __token__ -p "$PYPI_TOKEN"
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
