# Mastyf is a secret scanner, so its tests and attack corpora deliberately contain
# realistic-looking but fake credentials. Secret scanning ignores these paths so those
# samples don't raise public-leak alerts. Keep this list narrow: never add real config or
# source directories, and never put a real credential in any of these paths.
paths-ignore:
  - "tests/**"
  - "packages/*/test/**"
  - "packages/*/tests/**"
  - "adversarial-harness/fixtures/**"
  - "adversarial-harness/node/*.test.mjs"
  - "src/agentic/red-team/attack-generator.ts"
