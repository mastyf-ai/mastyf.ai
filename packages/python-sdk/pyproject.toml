[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mastyf-ai"
version = "5.1.0"
description = "Mastyf's free checks for your AI agent's tools: every tool call checked before it runs, every result before the model reads it. Runs on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mastyf Labs Private Limited" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
keywords = ["ai-agents", "prompt-injection", "security", "langchain", "langgraph", "openai-agents", "mcp"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
middleware = ["langchain>=1.0", "langgraph>=1.0"]
openai-agents = ["openai-agents>=0.2"]

[project.scripts]
mastyf-ai = "mastyf_ai.cli:main"

[project.urls]
Homepage = "https://www.mastyf.ai"
Repository = "https://github.com/mastyf-ai/mastyf.ai"

[tool.hatch.build.targets.wheel]
packages = ["mastyf_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
