version: '3.8'

services:
  mastyf-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - MASTYF_AIA_MODEL=Rudraneel93/mastyf-guard-1.5b-v2-boundary-sharpened
      - MASTYF_POLICY_DIR=/app/policies
      - MASTYF_AUDIT_LOG=/app/logs/audit.jsonl
    volumes:
      - ./logs:/app/logs
      - ./tests/fixtures/policies:/app/policies:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
