[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mastyf-gateway"
version = "0.1.1"
description = "Deterministic-First Capability-Based Security Gateway & Neural Auditor for AI Agents"
readme = "README.md"
authors = [{ name = "Mastyf AI Team", email = "security@mastyf.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "numpy>=1.26.0",
    "cryptography>=42.0.0",
    "huggingface-hub>=0.20.0"
]

[project.scripts]
mastyf = "mastyf_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["mastyf_gateway*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


